# Builds the iOS GPU userland (gpu/ci/build-ios-userland.sh: turnip with the
# sweet backend, libsweetvk, vktest, and with parts "metal" also
# sweetmetal-core and SweetMetal.bundle) on the same macOS runner type as the
# kernel, after the Linux host tests.
name: gpu-userland
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "build-ios-userland.sh PARTS"
        default: "mesa tools"
  push:
    branches: [apollo]
    paths:
      - "gpu/mesa/**"
      - "gpu/ci/**"
      - "gpu/hosttest/vktest.c"
      - "gpu/userland/sweetmetal/**"
      - ".github/workflows/gpu-userland.yml"
jobs:
  hosttest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kernel driver host test (register model)
        run: make -C gpu/hosttest check
      - name: arm64 compile of the driver C (inline asm, no XNU headers needed)
        run: |
          sudo apt-get install -y -q gcc-aarch64-linux-gnu
          for f in gpu/kernel/sweet_gpu_*.c; do
            case $f in *os_xnu.c) continue;; esac
            aarch64-linux-gnu-gcc -std=gnu11 -O2 -Wall -Werror -Wno-unused-parameter \
              -ffreestanding -mgeneral-regs-only -DARM64_BOARD_CONFIG_SWEET -c "$f" -o /dev/null
          done
  ios:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PARTS: ${{ github.event.inputs.parts || 'mesa tools' }}
        run: gpu/ci/build-ios-userland.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-userland-ios
          path: gpu/build-ios/out
