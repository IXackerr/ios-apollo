# Small iOS programs for the phone: ios/sweetrun (runs a program handed
# over in the boot image) and the GPU user-space tests (gpu/userland/gputest,
# gpu/hosttest/vktest.c, gpu/userland/vkcompute, vkdraw, smtltest, mtltest;
# turnip, libsweetmetal_core and SweetMetal.bundle come from gpu-userland).
name: ios-tools
on:
  workflow_dispatch:
  push:
    branches: [apollo]
    paths:
      - "ios/**"
      - "gpu/userland/libsweetgpu/**"
      - "gpu/userland/gputest/**"
      - "gpu/kernel/sweet_gpu_uapi.h"
      - "gpu/hosttest/vktest.c"
      - "gpu/userland/vkcompute/**"
      - "gpu/userland/vkdraw/**"
      - "gpu/userland/smtltest/**"
      - "gpu/userland/mtltest/**"
      - ".github/workflows/ios-tools.yml"
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall"
          mkdir -p out
          $CC -o out/sweetrun ios/sweetrun/sweetrun.c -framework IOKit -framework CoreFoundation -lz
          $CC -Igpu/kernel -Igpu/userland/libsweetgpu -o out/gputest \
            gpu/userland/gputest/gputest.c gpu/userland/libsweetgpu/sweetgpu.c ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c \
            -framework IOKit -framework CoreFoundation -lz
          # vktest dlopens turnip; the Khronos headers are enough to build it
          brew list vulkan-headers >/dev/null 2>&1 || brew install vulkan-headers
          $CC -I"$(brew --prefix vulkan-headers)/include" -Iios/sweetrun -o out/vktest \
            gpu/hosttest/vktest.c ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c -framework IOKit -framework CoreFoundation -lz
          brew list glslang >/dev/null 2>&1 || brew install glslang
          mkdir -p gen
          glslangValidator -V --vn square_spv gpu/userland/vkcompute/square.comp -o gen/square_spv.h
          $CC -I"$(brew --prefix vulkan-headers)/include" -Iios/sweetrun -Igen -o out/vkcompute \
            gpu/userland/vkcompute/vkcompute.c ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c -framework IOKit -framework CoreFoundation -lz
          for s in vert frag; do
            glslangValidator -V --vn tri_${s}_spv gpu/userland/vkdraw/tri.$s -o gen/tri_${s}_spv.h
          done
          $CC -I"$(brew --prefix vulkan-headers)/include" -Iios/sweetrun -Igen -o out/vkdraw \
            gpu/userland/vkdraw/vkdraw.c ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c -framework IOKit -framework CoreFoundation -lz
          xcrun -sdk iphoneos metal -c gpu/userland/smtltest/test.metal -o gen/test.air
          xcrun -sdk iphoneos metallib gen/test.air -o out/test.metallib
          $CC -Igpu/userland/sweetmetal/core/include -Iios/sweetrun -o out/smtltest \
            gpu/userland/smtltest/smtltest.c ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c -framework IOKit -framework CoreFoundation -lz
          $CC -fobjc-arc -fmodules -Iios/sweetrun -o out/mtltest gpu/userland/mtltest/mtltest.m \
            ios/sweetrun/sweetlog.c ios/sweetrun/sweetfile.c -framework Foundation -framework Metal -framework IOKit -framework IOSurface \
            -framework CoreFoundation -lz
          for f in out/*; do [ "${f%.metallib}" = "$f" ] && codesign -f -s - "$f"; done
          file out/*
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out
