# Small iOS programs for the phone: ios/sweetrun (runs a program handed
# over in the boot image) and the GPU user-space test (gpu/userland/gputest).
name: ios-tools
on:
  workflow_dispatch:
  push:
    branches: [apollo]
    paths:
      - "ios/**"
      - "gpu/userland/libsweetgpu/**"
      - "gpu/userland/gputest/**"
      - "gpu/kernel/sweet_gpu_uapi.h"
      - ".github/workflows/ios-tools.yml"
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall"
          mkdir -p out
          $CC -o out/sweetrun ios/sweetrun/sweetrun.c -framework IOKit -framework CoreFoundation
          $CC -Igpu/kernel -Igpu/userland/libsweetgpu -o out/gputest \
            gpu/userland/gputest/gputest.c gpu/userland/libsweetgpu/sweetgpu.c \
            -framework IOKit -framework CoreFoundation
          for f in out/*; do codesign -f -s - "$f"; done
          file out/*
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out
