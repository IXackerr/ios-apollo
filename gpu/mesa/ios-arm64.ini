# Meson cross file: Mesa turnip for iOS 16 arm64 (iPhone X userland on apollo).
# Used by gpu/ci/build-ios-userland.sh on a macOS host with Xcode 15.
# Mesa keys Darwin behaviour on system = 'darwin' (not 'ios'), see
# docs/METAL.md; subsystem needs meson >= 1.2.
[binaries]
c = ['xcrun', '-sdk', 'iphoneos', 'clang', '-arch', 'arm64', '-miphoneos-version-min=16.0']
cpp = ['xcrun', '-sdk', 'iphoneos', 'clang++', '-arch', 'arm64', '-miphoneos-version-min=16.0']
objc = ['xcrun', '-sdk', 'iphoneos', 'clang', '-arch', 'arm64', '-miphoneos-version-min=16.0']
ar = ['xcrun', '-sdk', 'iphoneos', 'ar']
strip = ['xcrun', '-sdk', 'iphoneos', 'strip']
pkg-config = 'false'

[host_machine]
system = 'darwin'
subsystem = 'ios'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

# Mesa's entrypoint tables reference every Vulkan entrypoint weakly and
# leave the unimplemented ones NULL. ld64 still wants each weak reference
# resolved at link time, so let dyld bind them (to NULL) at load time;
# dynamic_lookup does not work with chained fixups.
[built-in options]
c_link_args = ['-Wl,-undefined,dynamic_lookup', '-Wl,-no_fixup_chains']
cpp_link_args = ['-Wl,-undefined,dynamic_lookup', '-Wl,-no_fixup_chains']
